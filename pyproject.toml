[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-movie-trailer-generator"
version = "0.4.2"
description = "Windows desktop AI movie trailer generator: script to scored, cut, captioned trailer."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
authors = [{ name = "ai-movie-trailer-generator contributors" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
    "librosa>=0.10.2",
    "httpx>=0.27.0",
]

[project.scripts]
trailergen = "src.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]